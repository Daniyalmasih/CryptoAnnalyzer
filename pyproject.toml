[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cryptoanalyzer"
version = "1.0.0"
description = "Binance Futures Market Analysis Terminal"
readme = "README.md"
authors = [{name = "CryptoAnalyzer Team", email = "team@cryptoanalyzer.local"}]
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "aiohttp>=3.8.0",
    "websockets>=10.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "python-dateutil>=2.8.0",
    "rich>=13.0.0",
    "textual>=0.40.0",
    "plotext>=5.0.0",
    "orjson>=3.8.0",
]

[tool.setuptools]
packages = {find = {where = ["src"]}}
include-package-data = true

[tool.setuptools.package-data]
"*" = ["*.json", "*.toml"]
"src.rust_engine" = ["*.rs", "Cargo.toml"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --tb=short"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true